# Publishing a GitHub release tagged vX.Y.Z builds module.zip (with the pinned
# Rive runtime vendored into lib/) and attaches it plus module.json.
#
# Release channels: servers install and update from a channel manifest, not
# releases/latest, so a later line for another Foundry generation can't reach
# them by accident. Every normal release also replaces the assets on the
# rolling "channel-<CHANNEL>" release (itself a pre-release, so releases/latest
# is unaffected). Foundry v12 servers install from:
#   https://github.com/nathan-rive/foundary-rive/releases/download/channel-v12/module.json
# Pre-releases (spikes, tests) keep a manifest pointing at their own tag and
# never touch the channel.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  RIVE_VERSION: 2.44.2
  # The Foundry generation this branch's releases are for. A future v13+ line
  # would publish from its own branch with CHANNEL: v13 (or similar).
  CHANNEL: v12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Never ship a build that fails the tests or has unreviewed world-safety sites.
      - name: Unit tests
        run: node tests/run.mjs

      - name: World-safety audit (every site reviewed)
        run: python3 tools/audit.py --check

      - name: Vendor the Rive runtime
        run: |
          npm pack "@rive-app/canvas@${RIVE_VERSION}" --silent
          mkdir -p lib rive-pkg
          tar -xzf rive-app-canvas-${RIVE_VERSION}.tgz -C rive-pkg
          cp rive-pkg/package/rive.js rive-pkg/package/rive.wasm lib/
          cp rive-pkg/package/LICENSE lib/RIVE-LICENSE 2>/dev/null || true

      - name: Stamp the manifest
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          if [ "$PRERELEASE" = "true" ]; then
            MANIFEST="$REPO/releases/download/${GITHUB_REF_NAME}/module.json"
          else
            MANIFEST="$REPO/releases/download/channel-${CHANNEL}/module.json"
          fi
          jq --arg v "$VERSION" \
             --arg manifest "$MANIFEST" \
             --arg download "$REPO/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .manifest = $manifest | .download = $download' \
             module.json > module.stamped.json
          mv module.stamped.json module.json

      - name: Zip
        run: zip -r module.zip module.json scripts templates styles lang assets lib README.md LICENSE

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

      - name: Update the channel
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="channel-${CHANNEL}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Channel: Foundry ${CHANNEL}" \
              --notes "Rolling install channel for Foundry ${CHANNEL}. Install from this release's module.json; its assets are replaced by every ${CHANNEL} release."
          fi
          gh release upload "$TAG" module.json module.zip --clobber
